service: FeatureflowLambdaAtEdge

# Serverless Dashboard: set org and app (from app.serverless.com), then deploy with SERVERLESS_ACCESS_KEY set
org: oliveroldfield
app: featureflow-lambda-edge

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1

functions:
  redirect:
    handler: dist/handler.handler
    events:
      - cloudFront:
          eventType: origin-request
          origin: http://featureflow-redirect-example.s3-website-us-east-1.amazonaws.com
          # Default path pattern: handles all requests not matched by other behaviors

  features:
    handler: dist/features-handler.handler
    events:
      - cloudFront:
          eventType: origin-request
          origin: http://featureflow-redirect-example.s3-website-us-east-1.amazonaws.com
          pathPattern: /api/features*
          # Requests to /api/features (and subpaths) use this behavior; others use redirect


# Lambda@Edge does not allow environment variables. Serverless v4's built-in esbuild adds env vars
# (e.g. for source maps), so we disable it and compile TypeScript ourselves (npm run build:dist).
build:
  esbuild: false

package:
  excludeDevDependencies: false